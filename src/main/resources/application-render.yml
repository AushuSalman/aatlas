# ============================================================================
#  render - one Render web service, one Render-managed PostgreSQL instance
#
#  A demo/staging deploy target, not the `prod` profile's full Kubernetes/Redis/
#  Kafka/S3 shape: no message broker, no external cache, no object storage.
#  Caching is in-process and events are delivered in-process through the same
#  transactional registry, exactly like `local` - only the database is real
#  and remote instead of a laptop's Docker container, and secrets arrive as
#  environment variables rather than defaults.
# ============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  autoconfigure:
    exclude:
      # Autoconfigure would otherwise try to reach a broker that is not there.
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      # This is what actually schedules the ArchUnit classpath scan (on a background
      # SimpleAsyncTaskExecutor thread, so it does not even fail loudly - it just costs
      # memory this instance does not have to spare). Disabling management.tracing and
      # the modulith actuator endpoint stops two things that ask for the module graph,
      # but this autoconfiguration builds it unconditionally regardless of who asks -
      # excluding it at the source is the only way to actually stop the scan. Safe here:
      # its other job is invoking ApplicationModuleInitializer beans, and nothing in this
      # codebase implements that interface - every @ApplicationModuleListener is a plain
      # event listener and does not need the module graph to be delivered.
      - org.springframework.modulith.runtime.autoconfigure.SpringModulithRuntimeAutoConfiguration
      # management.endpoint.modulith.enabled: false (below) only hides this endpoint from
      # HTTP - Spring still evaluates its @Bean method and its ApplicationModulesRuntime
      # parameter, which no longer exists once the exclusion above removes it. Excluding
      # the configuration class itself is the only way that is actually consistent with
      # the exclusion above; confirmed locally, the property alone left this dangling.
      - org.springframework.modulith.actuator.autoconfigure.ApplicationModulesEndpointConfiguration

server:
  forward-headers-strategy: framework

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  # Two separate things build and ArchUnit-analyse the whole classpath into an
  # ApplicationModules graph at startup - expensive enough to run this instance out of
  # memory before a port is ever bound. `exposure.include` above only hides the modulith
  # endpoint from HTTP; the bean itself still gets created (and still does the scan)
  # unless disabled here too. This profile does not claim OTLP/tracing support anyway
  # (see header), and the module-graph endpoint is a local-dev/CI convenience, not
  # something this deployment target needs.
  tracing:
    enabled: false
  endpoint:
    modulith:
      enabled: false

aatlas:
  cors:
    # No default here would be fine only if CORS_ORIGINS is always set; it is not worth
    # the risk - an unresolved placeholder fails the whole context refresh and the
    # service never opens a port, which is a much worse failure than a wrong CORS list.
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  cache:
    mode: caffeine
  clock:
    fixed: false
  rls:
    enabled: true

logging:
  level:
    root: INFO
    com.aatlas: INFO
