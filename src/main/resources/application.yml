
# ============================================================================
#  Aatlas API - base configuration
#
#  Profiles:
#    local  (default) laptop: local PostgreSQL, in-process cache, no broker
#    dev              shared dev cluster
#    prod             Redis, Kafka, read replicas, PgBouncer, OTLP
#
#  Every value here can be overridden by an environment variable using Spring's
#  relaxed binding: aatlas.jwt.access-token-ttl -> AATLAS_JWT_ACCESSTOKENTTL
# ============================================================================

spring:
  application:
    name: aatlas-api
  profiles:
    default: local

  # A git-ignored .env next to the working directory, if there is one. Environment
  # variables still win, so Render and Kubernetes are unaffected.
  config:
    import: optional:file:.env[.properties]

  # Java 21 virtual threads: blocking JDBC stays simple, concurrency stays cheap.
  threads:
    virtual:
      enabled: true

  main:
    banner-mode: console

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aatlas}
    username: ${DB_USER:aatlas}
    password: ${DB_PASSWORD:aatlas}
    hikari:
      pool-name: aatlas-pool
      # Small on purpose. Six pods x 30 would exhaust the primary; PgBouncer in
      # transaction mode sits in front in production and multiplexes these.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false          # never hold a connection open for view rendering
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
        # Fail loudly in tests rather than shipping an N+1 to production.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      appUser: ${DB_USER:aatlas}

  jooq:
    sql-dialect: postgres

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      client-name: aatlas-api

  batch:
    jdbc:
      initialize-schema: never   # the batch tables live in a Flyway migration
    job:
      enabled: false             # jobs are launched by events and schedules, not on boot

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: aatlas-engine
      auto-offset-reset: earliest
      enable-auto-commit: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      # CSV imports stream to object storage; this is the guard, not the design.
      max-file-size: 200MB
      max-request-size: 200MB

  jackson:
    default-property-inclusion: non_null

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false         # event_publication lives in a Flyway migration
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 1024
  http2:
    enabled: true
  error:
    whitelabel:
      enabled: false
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 2MB
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith,caches,scheduledtasks
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: aatlas-api
    distribution:
      # p95 per endpoint per tenant is the number that catches slowness before users do.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 50ms,120ms,150ms,250ms,400ms
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

# ============================================================================
#  Application settings
# ============================================================================
aatlas:
  # api | engine-worker | ingest-worker. One artifact, three jobs.
  role: ${AATLAS_ROLE:api}

  jwt:
    issuer: ${JWT_ISSUER:https://api.aatlas.io}
    # Short access tokens, long refresh tokens rotated on every use.
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}

  mail:
    # log: mail is written to the console (local default). smtp: sent through spring.mail.*
    # (blocked outbound on Render - see ResendMailer). resend: Resend's REST API over HTTPS.
    transport: ${MAIL_TRANSPORT:log}
    from: ${MAIL_FROM:no-reply@aatlas.io}
    from-name: ${MAIL_FROM_NAME:Aatlas}
    # The frontend, for links in mail (password reset).
    app-url: ${APP_URL:http://localhost:3000}
    resend:
      # A Resend API key (resend.com/api-keys), not an SMTP relay. Empty means the
      # transport reports itself unconfigured rather than sending with no key.
      api-key: ${RESEND_API_KEY:}
      # Resend's own sandbox sender - works with no domain verification. Override once a
      # real sending domain is verified in Resend's dashboard.
      from: ${RESEND_FROM:onboarding@resend.dev}

  sso:
    # Google: an OAuth "Web application" client from console.cloud.google.com.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Apple: a Services ID, and a Sign in with Apple key (.p8) from developer.apple.com.
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}

  auth:
    # Signup refuses an address that was not proven with a mailed code.
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}

  tavily:
    # Web search for the AI price-research pilot. Empty means the feature is off -
    # TavilyClient reports itself unavailable rather than calling out with no key.
    api-key: ${TAVILY_API_KEY:}
    base-url: https://api.tavily.com

  competition:
    # Live competitor prices (competition module). Each provider is independent: an empty key
    # leaves that one off, and the Competition screen says which env var would turn it on.
    serpapi:
      # Google Shopping. Free plan: 250 searches/month - https://serpapi.com/manage-api-key
      api-key: ${SERPAPI_API_KEY:}
      base-url: https://serpapi.com
    ebay:
      # Browse API, free: 5,000 calls/day - https://developer.ebay.com/my/keys (Production keyset)
      client-id: ${EBAY_CLIENT_ID:}
      client-secret: ${EBAY_CLIENT_SECRET:}
      base-url: https://api.ebay.com
    rainforest:
      # Amazon, paid - https://app.rainforestapi.com
      api-key: ${RAINFOREST_API_KEY:}
      base-url: https://api.rainforestapi.com
    oxylabs:
      # Google Shopping via Web Scraper API, paid (free trial) - https://dashboard.oxylabs.io
      username: ${OXYLABS_USERNAME:}
      password: ${OXYLABS_PASSWORD:}
      base-url: https://realtime.oxylabs.io
      # The same account also prices tracked competitors' own product pages (CompetitorSites).
    daily-refresh:
      # Every product's competitor prices re-checked once a day, per tenant, with the sources the
      # tenant switched on (each tenant can turn this off in Settings). Runs on one pod (ShedLock).
      enabled: ${COMPETITION_DAILY_REFRESH:true}
      cron: "0 0 5 * * *"
    dataforseo:
      # Finds online competitors (DataForSEO Labs). Pay as you go, about $0.01 a search;
      # login and the generated API password at https://app.dataforseo.com/api-access
      login: ${DATAFORSEO_LOGIN:}
      password: ${DATAFORSEO_PASSWORD:}
      base-url: https://api.dataforseo.com

  outcomes:
    # What each applied sell price did: units and profit a week, window-days before against after at
    # its branch, measured nightly once the after-window closes. The observed price sensitivity is
    # blended into the pricing model, so outcomes - not only choices - shape the next recommendation.
    enabled: ${DECISION_OUTCOMES_ENABLED:true}
    cron: "0 30 4 * * *"
    window-days: 28
    # An outcome with too few sales is retried while the decision is younger than this.
    retry-days: 120
  pricing-model:
    # The model tuner: nightly, after the outcomes job, every ACTIVE tenant's sell and buy models re-fit a few
    # of their own knobs from the tenant's decisions and measured outcomes - price sensitivity, where new items
    # start on the phase-in, how far the lean may go. Stored as learned settings beside the hand-set ones and
    # explained per key; a hand-set value always wins. Runs on one pod (ShedLock); on demand per tenant from
    # POST /api/v1/pricing-model/tune.
    tune-enabled: ${PRICING_MODEL_TUNE_ENABLED:true}
    tune-cron: "0 0 5 * * *"
  demand-model:
    # The demand model (demandmodel module): a random forest of regression trees, one per tenant, fitted to the
    # tenant's own weekly sales per item and branch. Nightly after the tuner, every ACTIVE tenant; on demand from
    # POST /api/v1/demand-model/train. Each run holds the last holdout-weeks back and scores the model against the
    # naive baseline pair by pair; a pair the model did not beat is reported and never used. Runs on one pod.
    enabled: ${DEMAND_MODEL_ENABLED:true}
    cron: "0 15 5 * * *"
    holdout-weeks: 8
    trees: 100
    # Pairs spanning fewer weeks are left out; at most this many pairs (the busiest) are loaded per tenant.
    min-weeks: 12
    max-pairs: 2000
  delivery-model:
    # The delivery model (supplymodel module): two random forests per tenant on its received purchase orders - the
    # slip in days against what the supplier promised, and late as 0/1 read as a probability. Nightly after the
    # demand model; on demand from POST /api/v1/delivery-model/train. The latest holdout-share of the orders is held
    # back and each supplier is scored against its own trailing record; a supplier the model did not beat is
    # reported and never used. Runs on one pod.
    enabled: ${DELIVERY_MODEL_ENABLED:true}
    cron: "0 30 5 * * *"
    trees: 100
    holdout-share: 0.2
    min-holdout: 8
  market-data:
    # Live reference feeds (marketdata module): daily at 06:30 UTC and once at startup.
    enabled: ${MARKET_DATA_ENABLED:true}
    cron: "0 30 6 * * *"
    fred:
      # Free key: https://fredaccount.stlouisfed.org/apikeys. Empty = commodity moves stay on the seed.
      api-key: ${FRED_API_KEY:}
      base-url: https://api.stlouisfed.org
      # One monthly producer price index per commodities.commodity_key; its 3-month change becomes pct90.
      series:
        copper: WPU102502        # PPI: Copper and brass mill shapes
        brass: WPU102502         # same - no live brass-only PPI exists
        steel: WPU1017           # PPI: Steel mill products
        iron: PCU331511331511    # PPI: Iron foundries
        pvc: WPU072106033        # PPI: Plastics water pipe
        pex: PCU326122326122     # PPI: Plastics pipe and pipe fitting manufacturing
        equipment: PCU333415333415 # PPI: AC, refrigeration and forced-air heating equipment
    fx:
      # European Central Bank reference rates, no key. VND is not published there and keeps its seed.
      base-url: https://api.frankfurter.dev/v1

  cors:
    # Comma-separated exact origins (scheme + host + port, no path). The browser blocks
    # every request from an origin not on this list, however the request itself succeeds
    # against the server - it fails silently as far as the API is concerned, and shows up
    # only as a CORS error in the browser console. Set CORS_ORIGINS in production to the
    # deployed frontend's exact origin(s), e.g. https://aatlas-ai.vercel.app.
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

  clock:
    # The prototype freezes now at 1 Sep 2026. Production runs on the real clock;
    # only demo tenants stay frozen.
    fixed: ${CLOCK_FIXED:false}
    fixed-at: 2026-09-01T12:00:00Z
    zone: UTC

  cache:
    mode: ${CACHE_MODE:caffeine}   # caffeine | redis

  snapshots:
    # A controller never runs an item-by-store walk inline. On a miss it returns 202
    # with a job id and a worker fills the snapshot.
    compute-on-miss: false
    stale-after: PT6H

  storage:
    bucket: ${S3_BUCKET:aatlas-local}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    path-style-access: true

  rls:
    # On. The policies now exist on every tenant-scoped table, created with
    # app.enable_tenant_rls() and FORCE ROW LEVEL SECURITY - which binds the table
    # owner too, so there is no role that quietly bypasses them.
    #
    # This must stay in step with the migrations. With policies present and this off,
    # nothing sets app.tenant_id, app.current_tenant() returns NULL, and every insert
    # into a tenant-scoped table fails with "new row violates row-level security
    # policy" while reads return nothing - which is exactly what happened when the
    # policies landed and this was still false.
    enabled: ${RLS_ENABLED:true}
    session-variable: app.tenant_id

logging:
  level:
    root: INFO
    com.aatlas: ${LOG_LEVEL:DEBUG}
    org.springframework.modulith: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.bind: WARN
