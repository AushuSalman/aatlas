# The module packages are still empty skeletons, so most rules currently match no
# classes. Failing on that would mean deleting the rules until the code they guard
# exists - which is backwards: the rule should be in place before the first line it
# governs is written.
#
# Flip this to true once the modules have code, so a rule that silently stops
# matching anything (a renamed package, say) is reported instead of passing.
archRule.failOnEmptyShould=false
